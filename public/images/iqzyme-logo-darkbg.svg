<svg xmlns="http://www.w3.org/2000/svg" viewBox="42 12 546 492" width="100%" height="100%">
  <defs>
    <!-- Green gradient for the stylized Q loop -->
    <linearGradient id="qLimeGreenGradDark" x1="85%" y1="15%" x2="15%" y2="85%">
      <stop offset="0%" stop-color="#95E24B"/>
      <stop offset="35%" stop-color="#7CD637"/>
      <stop offset="75%" stop-color="#5FC224"/>
      <stop offset="100%" stop-color="#4EAC1A"/>
    </linearGradient>

    <!-- Blue gradient for the dynamic swoosh -->
    <linearGradient id="qSapphireBlueGradDark" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#4B91DD"/>
      <stop offset="50%" stop-color="#347CCB"/>
      <stop offset="100%" stop-color="#205EAC"/>
    </linearGradient>

    <!-- Star glint diamond gradient -->
    <linearGradient id="qStarGlintDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#B4DCFA"/>
      <stop offset="100%" stop-color="#DCEDFE"/>
    </linearGradient>
  </defs>

  <!-- ====================================================
       1. TOP EMBLEM: THE STYLIZED "Q" WITH STAR & BLUE SWOOSH
       ==================================================== -->
  <g transform="translate(185, 20) scale(1.15)">
    <!-- 4-point Diamond Star Sparkle (Top-Left Corner) -->
    <g transform="translate(10, 2)">
      <path d="M 18 0 Q 18 18 0 18 Q 18 18 18 36 Q 18 18 36 18 Q 18 18 18 0 Z" fill="url(#qStarGlintDark)" />
      <circle cx="18" cy="18" r="3.5" fill="#FFFFFF" opacity="0.98"/>
    </g>

    <!-- Registered symbol top-right of Icon -->
    <g transform="translate(196, 12)">
      <circle cx="9" cy="9" r="8" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
      <text x="9" y="12.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">R</text>
    </g>

    <!-- Outer Green Q Body -->
    <path 
      d="M 60 26
         C 44 26, 32 38, 32 54
         L 32 144
         C 32 172, 54 194, 82 194
         L 136 194
         C 164 194, 186 172, 186 144
         L 186 54
         C 186 26, 164 4, 136 4
         L 78 4
         C 70 4, 64 8, 62 14
         L 60 26
         Z" 
      fill="url(#qLimeGreenGradDark)" 
    />

    <!-- Inner Hole for background blend -->
    <path 
      d="M 80 40
         L 138 40
         C 150 40, 158 48, 158 60
         L 158 138
         C 158 150, 150 158, 138 158
         L 80 158
         C 68 158, 60 150, 60 138
         L 60 60
         C 60 48, 68 40, 80 40
         Z" 
      fill="#2D3A55" 
    />

    <!-- Dynamic Blue Swoosh -->
    <path 
      d="M 94 104
         C 106 122, 126 146, 150 162
         L 158 198
         C 168 202, 186 200, 192 198
         C 180 182, 170 160, 158 136
         C 144 112, 132 96, 116 84
         C 104 74, 94 72, 90 74
         C 88 76, 90 90, 94 104
         Z"
      fill="url(#qSapphireBlueGradDark)"
    />
  </g>

  <!-- ====================================================
       2. MIDDLE TEXT: IQZYME IN WHITE (EXACT SAME SHAPES)
       ==================================================== -->
  <g fill="#FFFFFF">
    <!-- I (Taller) -->
    <rect x="52" y="278" width="38" height="136" rx="1.5" />

    <!-- Q (Taller with Descending Tail) -->
    <path d="M 148 274
             C 114 274, 94 298, 94 346
             C 94 394, 114 418, 148 418
             C 166 418, 181 408, 191 391
             L 191 426
             L 218 440
             L 218 396
             C 225 382, 228 366, 228 346
             C 228 298, 208 274, 174 274
             Z
             M 161 308
             C 178 308, 191 322, 191 346
             C 191 370, 178 384, 161 384
             C 144 384, 131 370, 131 346
             C 131 322, 144 308, 161 308
             Z" />

    <!-- Z (Standard height) -->
    <path d="M 238 308
             L 302 308
             L 302 338
             L 266 384
             L 304 384
             L 304 414
             L 236 414
             L 236 384
             L 272 338
             L 238 338
             Z" />

    <!-- Y (Standard height) -->
    <path d="M 311 308
             L 339 308
             L 358 358
             L 377 308
             L 405 308
             L 374 376
             L 374 414
             L 342 414
             L 342 376
             Z" />

    <!-- M (Standard height) -->
    <path d="M 414 308
             L 444 308
             L 462 370
             L 480 308
             L 510 308
             L 510 414
             L 482 414
             L 482 355
             L 470 395
             L 454 395
             L 442 355
             L 442 414
             L 414 414
             Z" />

    <!-- E (Standard height) -->
    <path d="M 520 308
             L 576 308
             L 576 338
             L 550 338
             L 550 348
             L 572 348
             L 572 374
             L 550 374
             L 550 384
             L 578 384
             L 578 414
             L 520 414
             Z" />

    <!-- Registered Trademark symbol at top-right of E -->
    <g transform="translate(562, 282)">
      <circle cx="9" cy="9" r="8" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
      <text x="9" y="12.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">R</text>
    </g>
  </g>

  <!-- ====================================================
       3. BOTTOM TEXT: MEDTECH PVT. LTD. IN WHITE
       ==================================================== -->
  <text 
    x="300" 
    y="488" 
    font-family="'Arial Black', 'Impact', 'Segoe UI Black', -apple-system, sans-serif" 
    font-size="42" 
    font-weight="900" 
    letter-spacing="2.8" 
    fill="#FFFFFF" 
    text-anchor="middle"
  >
    MEDTECH PVT. LTD.
  </text>
</svg>
