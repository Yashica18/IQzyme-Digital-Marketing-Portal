<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <defs>
    <!-- Green gradient for Q loop -->
    <linearGradient id="hGreenGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#80CF40"/>
      <stop offset="50%" stop-color="#67BE33"/>
      <stop offset="100%" stop-color="#4FA61D"/>
    </linearGradient>

    <!-- Blue gradient for Q tail swoosh -->
    <linearGradient id="hBlueGrad" x1="10%" y1="20%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#3C7EBF"/>
      <stop offset="100%" stop-color="#235FA8"/>
    </linearGradient>

    <!-- Star glint gradient -->
    <linearGradient id="hStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8DCF8"/>
      <stop offset="50%" stop-color="#7EAFDC"/>
      <stop offset="100%" stop-color="#A5CEF2"/>
    </linearGradient>
  </defs>

  <!-- Left Stylized Q Emblem -->
  <g transform="translate(6, 6) scale(0.44)">
    <!-- 4-point Diamond Star Sparkle (Top-Left) -->
    <g transform="translate(18, 8)">
      <path d="M 16 0 Q 16 16 0 16 Q 16 16 16 32 Q 16 16 32 16 Q 16 16 16 0 Z" fill="url(#hStarGrad)" />
      <circle cx="16" cy="16" r="3.2" fill="#FFFFFF" opacity="0.95"/>
    </g>

    <!-- Registered symbol top-right of Icon -->
    <g transform="translate(162, 14)">
      <circle cx="8" cy="8" r="7.5" fill="none" stroke="#162540" stroke-width="1.5"/>
      <text x="8" y="11.2" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#162540" text-anchor="middle">R</text>
    </g>

    <!-- Outer Green Q Body -->
    <path 
      d="M 50 30
         C 40 30, 32 38, 32 48
         L 32 144
         C 32 170, 54 192, 80 192
         L 128 192
         C 154 192, 176 170, 176 144
         L 176 48
         C 176 22, 154 0, 128 0
         L 70 0
         C 66 0, 62 2, 62 6
         L 62 30
         Z" 
      fill="url(#hGreenGrad)" 
    />

    <!-- Inner Cutout of the Q Loop -->
    <path 
      d="M 78 44
         L 128 44
         C 138 44, 146 52, 146 62
         L 146 128
         C 146 138, 138 146, 128 146
         L 78 146
         C 68 146, 60 138, 60 128
         L 60 62
         C 60 52, 68 44, 78 44
         Z" 
      fill="#FFFFFF" 
    />

    <!-- Dynamic Blue Swoosh Tail -->
    <path 
      d="M 88 104
         C 102 122, 122 144, 144 158
         L 152 192
         C 162 195, 178 194, 182 192
         C 172 178, 162 158, 150 136
         C 138 114, 126 98, 112 86
         C 98 74, 89 71, 85 73
         C 84 75, 85 89, 88 104
         Z"
      fill="url(#hBlueGrad)"
    />
  </g>

  <!-- Right Side Wordmark -->
  <g transform="translate(108, 0)">
    <!-- IQZYME -->
    <g fill="#162540" transform="translate(0, 14) scale(0.66)">
      <!-- I -->
      <path d="M 0 5 L 20 5 L 20 78 L 0 78 Z" />

      <!-- Q -->
      <path d="M 52 3
               C 34 3, 22 16, 22 41
               C 22 66, 34 78, 52 78
               C 63 78, 72 72, 77 62
               L 77 82
               L 92 90
               L 92 65
               C 96 57, 98 48, 98 41
               C 98 16, 86 3, 68 3
               Z
               M 60 22
               C 70 22, 78 30, 78 41
               C 78 52, 70 60, 60 60
               C 50 60, 42 52, 42 41
               C 42 30, 50 22, 60 22
               Z" />

      <!-- Z -->
      <path d="M 106 5 L 144 5 L 144 23 L 123 60 L 145 60 L 145 78 L 105 78 L 105 60 L 127 23 L 106 23 Z" />

      <!-- Y -->
      <path d="M 150 5 L 166 5 L 177 40 L 188 5 L 204 5 L 187 50 L 187 78 L 168 78 L 168 50 Z" />

      <!-- M -->
      <path d="M 210 5 L 227 5 L 238 45 L 249 5 L 266 5 L 266 78 L 250 78 L 250 33 L 243 59 L 233 59 L 226 33 L 226 78 L 210 78 Z" />

      <!-- E -->
      <path d="M 273 5 L 305 5 L 305 23 L 290 23 L 290 35 L 302 35 L 302 50 L 290 50 L 290 63 L 306 63 L 306 78 L 273 78 Z" />
    </g>

    <!-- Registered trademark beside IQZYME -->
    <g transform="translate(208, 18)">
      <circle cx="5" cy="5" r="4.8" fill="none" stroke="#162540" stroke-width="1.1"/>
      <text x="5" y="7.2" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="5.5" font-weight="bold" fill="#162540" text-anchor="middle">R</text>
    </g>

    <!-- MEDTECH PVT. LTD. -->
    <text 
      x="1" 
      y="84" 
      font-family="'Arial Black', 'Impact', 'Segoe UI Black', sans-serif" 
      font-size="20.5" 
      font-weight="900" 
      letter-spacing="1.4" 
      fill="#162540"
    >
      MEDTECH PVT. LTD.
    </text>
  </g>
</svg>
