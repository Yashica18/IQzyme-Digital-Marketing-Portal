<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Green gradient for Q loop -->
    <linearGradient id="iconGreenGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#80CF40"/>
      <stop offset="50%" stop-color="#67BE33"/>
      <stop offset="100%" stop-color="#4FA61D"/>
    </linearGradient>

    <!-- Blue gradient for Q tail swoosh -->
    <linearGradient id="iconBlueGrad" x1="10%" y1="20%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#3C7EBF"/>
      <stop offset="100%" stop-color="#235FA8"/>
    </linearGradient>

    <!-- Star glint gradient -->
    <linearGradient id="iconStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8DCF8"/>
      <stop offset="50%" stop-color="#7EAFDC"/>
      <stop offset="100%" stop-color="#A5CEF2"/>
    </linearGradient>
  </defs>

  <g transform="translate(10, 8)">
    <!-- 4-point Diamond Star Sparkle (Top-Left) -->
    <g transform="translate(18, 8)">
      <path d="M 16 0 Q 16 16 0 16 Q 16 16 16 32 Q 16 16 32 16 Q 16 16 16 0 Z" fill="url(#iconStarGrad)" />
      <circle cx="16" cy="16" r="3.2" fill="#FFFFFF" opacity="0.95"/>
    </g>

    <!-- Registered symbol top-right of Icon -->
    <g transform="translate(162, 14)">
      <circle cx="8" cy="8" r="7.5" fill="none" stroke="#162540" stroke-width="1.5"/>
      <text x="8" y="11.2" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#162540" text-anchor="middle">R</text>
    </g>

    <!-- Outer Green Q Body -->
    <path 
      d="M 50 30
         C 40 30, 32 38, 32 48
         L 32 144
         C 32 170, 54 192, 80 192
         L 128 192
         C 154 192, 176 170, 176 144
         L 176 48
         C 176 22, 154 0, 128 0
         L 70 0
         C 66 0, 62 2, 62 6
         L 62 30
         Z" 
      fill="url(#iconGreenGrad)" 
    />

    <!-- Inner Cutout of the Q Loop -->
    <path 
      d="M 78 44
         L 128 44
         C 138 44, 146 52, 146 62
         L 146 128
         C 146 138, 138 146, 128 146
         L 78 146
         C 68 146, 60 138, 60 128
         L 60 62
         C 60 52, 68 44, 78 44
         Z" 
      fill="#FFFFFF" 
    />

    <!-- Dynamic Blue Swoosh Tail -->
    <path 
      d="M 88 104
         C 102 122, 122 144, 144 158
         L 152 192
         C 162 195, 178 194, 182 192
         C 172 178, 162 158, 150 136
         C 138 114, 126 98, 112 86
         C 98 74, 89 71, 85 73
         C 84 75, 85 89, 88 104
         Z"
      fill="url(#iconBlueGrad)"
    />
  </g>
</svg>
